name: Buscar ofertas

on:
  schedule:
    - cron: "17 10 * * 1-5"   # lunes a viernes, 07:17 hora Argentina
  workflow_dispatch:
    inputs:
      guardar:
        description: "Guardar los resultados en el repo"
        type: boolean
        default: true
      prueba:
        description: "Modo prueba: ignora el historial y no guarda"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: buscar-ofertas
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Buscar ofertas
        run: python main.py jobs search ${{ inputs.prueba && '--dry-run --sin-historial --json' || '' }}

      - name: Guardar resultados
        if: ${{ github.event_name == 'schedule' || (inputs.guardar && !inputs.prueba) }}
        run: |
          git config user.name "buscador-ofertas"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Ofertas $(date -u +%Y-%m-%d)"
            git push
          fi
