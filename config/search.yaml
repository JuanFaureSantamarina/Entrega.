# ============================================================
# Búsqueda automática de ofertas
# Lo usa: python main.py jobs search  (y el workflow diario de GitHub Actions)
# ============================================================

# Títulos que buscamos. Se usan como consulta en cada fuente y para puntuar.
keywords:
  es:
    - analista de procesos
    - analista de operaciones
    - mejora continua
    - analista administrativo
    - analista de administración
    - administración y finanzas
    - analista de compras
    - cuentas a pagar
    - cuentas a cobrar
    - tesorería
    - control de gestión
    - analista de costos
    - pasantía administración
    - jóvenes profesionales
  en:
    - operations analyst
    - process analyst
    - business operations
    - operations associate
    - process improvement
    - finance operations
    - revenue operations
    - procurement analyst
    - accounts payable
    - business analyst
    - operations coordinator
    - automation specialist

# Palabras del CV que suman puntos si aparecen en el título o la descripción.
skills_cv:
  - excel
  - sql
  - n8n
  - automatiza
  - automation
  - kpi
  - reporting
  - indicadores
  - procesos
  - process
  - mejora continua
  - continuous improvement
  - conciliaci
  - reconciliation
  - cobranza
  - collections
  - proveedores
  - suppliers
  - inventario
  - inventory
  - costos
  - costing
  - power bi
  - crm
  - workflow
  - inglés
  - english

# Si el título contiene alguna de estas, se descarta.
excluir_titulos:
  - developer
  - desarrollador
  - programador
  - engineer
  - ingeniero
  - devops
  - nurse
  - enfermer
  - chofer
  - driver
  - vendedor
  - telemarketer
  - call center
  - medic
  - abogad
  - director
  - vice president
  - vp
  - head of

# Penalizan el puntaje (Juan apunta a junior / analista / semi-senior, pero no las descartamos).
seniority_alta:
  - senior
  - sr
  - lead
  - manager
  - gerente
  - jefe

# Modalidades aceptadas. Las presenciales se descartan.
modalidad: [remoto, hibrido]

# Ofertas por debajo de este puntaje no se guardan.
puntaje_minimo: 30

