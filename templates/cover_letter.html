<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cover Letter {{ candidate.name }}</title>
<style>
  @page { size: A4; margin: 0; }
  body { margin: 0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #1f2933; font-size: 10.5pt; line-height: 1.55; }
  .page { width: 210mm; min-height: 297mm; padding: 22mm 22mm 18mm; }
  header { border-bottom: 2px solid #1e3a5f; padding-bottom: 8px; margin-bottom: 18px; }
  h1 { font-size: 18pt; letter-spacing: 0.06em; margin: 0; color: #1e3a5f; }
  .contact { color: #5c6b79; font-size: 9.5pt; margin-top: 4px; }
  .date { color: #5c6b79; margin-bottom: 16px; }
  p { margin: 0 0 11px; text-align: justify; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>{{ candidate.name | upper }}</h1>
    <div class="contact">{{ candidate.phone }} · {{ candidate.email }} · {{ candidate.location }}</div>
  </header>
  <div class="date">{{ candidate.location.split(',')[0] if candidate.location else '' }}, {{ today }}</div>
  {% for p in paragraphs %}<p>{{ p | e | replace('\n', '<br>') }}</p>{% endfor %}
</div>
</body>
</html>
